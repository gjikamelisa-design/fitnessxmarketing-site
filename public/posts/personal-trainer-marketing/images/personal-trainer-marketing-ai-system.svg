<rect x="610" y="295" width="250" height="172" rx="18" fill="#fff"/><text x="634" y="337" fill="#068f8c" font-size="21">03</text><text x="634" y="383" fill="#252a34">Content flow</text><text x="634" y="423" fill="#687281" font-size="17" font-weight="400">One idea, many formats</text>
<rect x="881" y="295" width="250" height="172" rx="18" fill="#fff"/><text x="905" y="337" fill="#068f8c" font-size="21">04</text><text x="905" y="383" fill="#252a34">Lead follow-up</text><text x="905" y="423" fill="#687281" font-size="17" font-weight="400">You review + send</text>
