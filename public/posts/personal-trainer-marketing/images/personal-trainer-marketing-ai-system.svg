<text x="600" y="190" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="48">Build an AI-assisted marketing system</text>
<g font-family="Arial,sans-serif" font-weight="700" font-size="24">
<rect x="68" y="295" width="250" height="172" rx="18" fill="#fff"/><text x="92" y="337" fill="#068f8c" font-size="21">01</text><text x="92" y="383" fill="#252a34">Brand files</text><text x="92" y="423" fill="#687281" font-size="17" font-weight="400">Your clients + voice</text>
