<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Arial, sans-serif">
  <rect width="800" height="320" fill="#eaf6f6" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#252a34" font-size="18" font-weight="bold">WHERE OBJECTIONS SIT ON THE BUYING SPECTRUM</text>
  
  <!-- Main bar -->
  <defs>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a4252" stop-opacity="0.3"/>
      <stop offset="52%" stop-color="#08d9d6"/>
      <stop offset="100%" stop-color="#1df7f4"/>
    </linearGradient>
  </defs>
  <rect x="80" y="100" width="640" height="50" rx="25" fill="url(#specGrad)"/>
  
  <!-- Markers -->
  <!-- Ghosted -->
  <circle cx="120" cy="125" r="8" fill="#ffffff" stroke="#3a4252" stroke-width="2"/>
  <text x="120" y="180" text-anchor="middle" fill="#3a4252" font-size="13" font-weight="bold">Ghosted you</text>
  <text x="120" y="198" text-anchor="middle" fill="#3a4252" font-size="11">0% interested</text>
  
  <!-- Objection - highlighted -->
  <circle cx="420" cy="125" r="14" fill="#ffffff" stroke="#1df7f4" stroke-width="3"/>
  <text x="420" y="125" text-anchor="middle" fill="#252a34" font-size="11" font-weight="bold" dominant-baseline="middle">52%+</text>
  
  <rect x="320" y="160" width="200" height="56" rx="8" fill="#252a34"/>
  <text x="420" y="182" text-anchor="middle" fill="#08d9d6" font-size="14" font-weight="bold">Raised an objection</text>
  <text x="420" y="202" text-anchor="middle" fill="#ffffff" font-size="11">More than halfway convinced</text>
  
  <!-- Ready to buy -->
  <circle cx="700" cy="125" r="8" fill="#1df7f4" stroke="#252a34" stroke-width="2"/>
  <text x="700" y="180" text-anchor="middle" fill="#252a34" font-size="13" font-weight="bold">Ready to buy</text>
  <text x="700" y="198" text-anchor="middle" fill="#3a4252" font-size="11">100% convinced</text>
  
  <!-- Arrow -->
  <line x1="100" y1="250" x2="700" y2="250" stroke="#eaeaea" stroke-width="2"/>
  <polygon points="700,244 714,250 700,256" fill="#eaeaea"/>
  
  <!-- Bottom insight -->
  <text x="400" y="290" text-anchor="middle" fill="#06a8a5" font-size="13" font-weight="bold">If they bothered to object, they're closer than you think.</text>
</svg>